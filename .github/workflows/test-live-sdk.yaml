name: Live SDK memory e2e (real models)

# Runs real, billed agent SDK sessions (Claude Agent SDK, OpenAI Agents SDK)
# with Context Graph as their memory, and asserts what lands in Memgraph:
# tests/test_live_sdk_memory.py in sessions-graph. It runs only when a change
# can affect an SDK app's memory: the SDK wiring and the claude-code rules it
# reuses, the hub's capture path, the connectors, or this harness.
on:
  pull_request:
    paths:
      - "context-graph/memgraph-context-graph/src/**"
      - "context-graph/memgraph-context-graph/pyproject.toml"
      - "context-graph/actions-graph/src/**"
      - "context-graph/sessions-graph/src/**"
      - "context-graph/sessions-graph/pyproject.toml"
      - "context-graph/sessions-graph/tests/test_live_sdk_memory.py"
      - "memgraph-toolbox/src/**"
      - ".github/workflows/test-live-sdk.yaml"
  workflow_dispatch: {}

concurrency:
  group: live-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-sdk:
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [claude_agent_sdk, openai_agents_sdk]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Start Memgraph container
        run: |
          # MAGE: recall's embeddings run inside Memgraph.
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7687) 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs memgraph || true
          exit 1

      - name: Install uv
        run: python -m pip install uv

      # The Claude Agent SDK's wheel bundles its CLI, so no Node install is needed.
      - name: Run the ${{ matrix.sdk }} session pair
        working-directory: context-graph/sessions-graph
        env:
          LIVE_SDK_E2E: "1"
          MEMGRAPH_URL: bolt://localhost:7687
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AGENTS_DISABLE_TRACING: "1"
        run: >-
          uv run --package sessions-graph --extra test --extra reconciliation --extra memgraph-context-graph --extra sdk
          pytest tests/test_live_sdk_memory.py -v -k ${{ matrix.sdk }}

      - name: Show what Memgraph holds
        if: failure()
        run: |
          echo 'MATCH (n) RETURN labels(n) AS labels, count(*) AS count;' | docker exec -i memgraph mgconsole || true

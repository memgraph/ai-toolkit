name: Experiment - Memgraph on a Windows runner (manual)

# Throwaway probe: which of these gives a Windows runner a Bolt endpoint on
# localhost:7687 that install.ps1's `setup` can use? Docker on windows-latest
# runs Windows containers only and Memgraph ships a Linux image, so the
# candidates are a Linux Docker engine, WSL running Memgraph's .deb, and a
# larger runner with nested virtualization. Delete once test-install-matrix.yaml
# uses the winner.
on:
  # Temporary: a manual trigger only works once the file is on main, so the probe also runs on its PR.
  pull_request:
    paths:
      - ".github/workflows/experiment-windows-memgraph.yaml"
  workflow_dispatch:
    inputs:
      memgraph_version:
        description: Memgraph release for the WSL .deb
        default: "3.8.1"

jobs:
  windows-memgraph:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        approach: [docker-linux-engine, wsl1-deb, wsl2-deb]
    steps:
      - name: What the runner offers
        shell: pwsh
        run: |
          docker version 2>&1 | Out-Host
          docker info --format '{{.OSType}}' 2>&1 | Out-Host
          wsl --status 2>&1 | Out-Host
          systeminfo | Select-String 'Hyper-V|Virtualization'

      - name: Docker, switched to Linux containers
        if: matrix.approach == 'docker-linux-engine'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Docker\Docker\DockerCli.exe" -SwitchLinuxEngine
          docker info --format '{{.OSType}}'
          docker run -d --name memgraph -p 7687:7687 memgraph/memgraph:latest

      - name: WSL distro
        if: startsWith(matrix.approach, 'wsl')
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: ${{ matrix.approach == 'wsl1-deb' && '1' || '2' }}
          use-cache: "false"

      - name: Memgraph .deb inside WSL
        if: startsWith(matrix.approach, 'wsl')
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/memgraph.deb \
            "https://download.memgraph.com/memgraph/v${{ inputs.memgraph_version || '3.8.1' }}/ubuntu-24.04/memgraph_${{ inputs.memgraph_version || '3.8.1' }}-1_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y /tmp/memgraph.deb

      - name: Start Memgraph from Windows so it outlives the step
        if: startsWith(matrix.approach, 'wsl')
        shell: pwsh
        run: |
          Start-Process -FilePath wsl.exe -WindowStyle Hidden -ArgumentList @(
            '-d', 'Ubuntu-24.04', '-u', 'memgraph', '--',
            'memgraph', '--bolt-address=0.0.0.0', '--log-file=/tmp/memgraph.log', '--also-log-to-stderr')

      # Not a bare port check: WSL's localhost relay accepts connections even when nothing listens inside.
      - name: Does Memgraph answer a Bolt query from Windows?
        shell: pwsh
        run: |
          python -m pip install --quiet neo4j
          $probe = @'
          from neo4j import GraphDatabase
          d = GraphDatabase.driver("bolt://127.0.0.1:7687", auth=("", ""), connection_timeout=3.0)
          print(d.session().run("SHOW VERSION").data())
          '@
          foreach ($attempt in 1..20) {
            $out = python -c $probe 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Host "answered after $attempt attempt(s): $out"; exit 0 }
            Start-Sleep -Seconds 3
          }
          Write-Host $out
          exit 1

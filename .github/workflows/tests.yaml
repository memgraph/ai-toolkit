name: Run Integration tests

on:
  push:
    branches:
      - main
    paths:
      - "memgraph-toolbox/**"
      - "integrations/mcp-memgraph/**"
      - "integrations/langchain-memgraph/**"
      - "integrations/lightrag-memgraph/**"
      - "unstructured2graph/**"
      - "context-graph/skills-graph/**"
      - "context-graph/actions-graph/**"
      - "context-graph/agent-context-graph/**"
      - "context-graph/sessions-graph/**"
  pull_request:
    paths:
      - "memgraph-toolbox/**"
      - "integrations/mcp-memgraph/**"
      - "integrations/langchain-memgraph/**"
      - "integrations/lightrag-memgraph/**"
      - "unstructured2graph/**"
      - "context-graph/skills-graph/**"
      - "context-graph/actions-graph/**"
      - "context-graph/agent-context-graph/**"
      - "context-graph/sessions-graph/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      memgraph-toolbox: ${{ steps.filter.outputs.memgraph-toolbox }}
      mcp-memgraph: ${{ steps.filter.outputs.mcp-memgraph }}
      langchain-memgraph: ${{ steps.filter.outputs.langchain-memgraph }}
      lightrag-memgraph: ${{ steps.filter.outputs.lightrag-memgraph }}
      unstructured2graph: ${{ steps.filter.outputs.unstructured2graph }}
      agent-context-graph: ${{ steps.filter.outputs.agent-context-graph }}
      skills-graph: ${{ steps.filter.outputs.skills-graph }}
      actions-graph: ${{ steps.filter.outputs.actions-graph }}
      sessions-graph: ${{ steps.filter.outputs.sessions-graph }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            memgraph-toolbox:
              - 'memgraph-toolbox/**'
            mcp-memgraph:
              - 'integrations/mcp-memgraph/**'
              - 'memgraph-toolbox/**'
            langchain-memgraph:
              - 'integrations/langchain-memgraph/**'
              - 'memgraph-toolbox/**'
            lightrag-memgraph:
              - 'integrations/lightrag-memgraph/**'
              - 'memgraph-toolbox/**'
            unstructured2graph:
              - 'unstructured2graph/**'
              - 'memgraph-toolbox/**'
            agent-context-graph:
              - 'context-graph/agent-context-graph/**'
            skills-graph:
              - 'context-graph/skills-graph/**'
              - 'context-graph/agent-context-graph/**'
              - 'memgraph-toolbox/**'
            actions-graph:
              - 'context-graph/actions-graph/**'
              - 'context-graph/agent-context-graph/**'
              - 'memgraph-toolbox/**'
            sessions-graph:
              - 'context-graph/sessions-graph/**'
              - 'context-graph/actions-graph/**'
              - 'context-graph/agent-context-graph/**'
              - 'unstructured2graph/**'
              - 'memgraph-toolbox/**'

  test-memgraph-toolbox:
    needs: changes
    if: ${{ needs.changes.outputs.memgraph-toolbox == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false
          sleep 5

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: memgraph-toolbox
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --package memgraph-toolbox --extra test --extra evaluations --extra client pytest .

  test-mcp-memgraph:
    needs: changes
    if: ${{ needs.changes.outputs.mcp-memgraph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false
          sleep 5

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: integrations/mcp-memgraph
        run: uv run --package mcp-memgraph --extra test pytest .

  test-langchain-memgraph:
    needs: changes
    if: ${{ needs.changes.outputs.langchain-memgraph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false
          sleep 5

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: integrations/langchain-memgraph
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --package langchain-memgraph --extra test pytest .

  test-lightrag-memgraph:
    needs: changes
    if: ${{ needs.changes.outputs.lightrag-memgraph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: integrations/lightrag-memgraph
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          # MAGE image bundles the vector_search + embeddings modules the
          # integration tests exercise. One instance is reused for the whole job.
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false
        working-directory: .

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7687) 2>/dev/null; then
              echo "Memgraph is accepting Bolt connections"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs memgraph || true
          exit 1
        working-directory: .

      - name: Install uv
        run: python -m pip install uv
        working-directory: .

      - name: Install dependencies and run tests
        env:
          # Point the storage backends at the reused Memgraph instance so the
          # live integration tests actually run (they skip when unreachable).
          # Only the canonical memgraph-toolbox names are set here; core.py
          # bridges them to LightRAG's graph-backend names (MEMGRAPH_URI/
          # MEMGRAPH_USERNAME) so the graph backend and the toolbox-backed KV /
          # vector / doc-status storages all resolve to the same instance.
          MEMGRAPH_URL: bolt://localhost:7687
          MEMGRAPH_USER: ""
          MEMGRAPH_PASSWORD: ""
          MEMGRAPH_DATABASE: memgraph
        run: |
          uv venv
          uv pip install -e .[dev]
          .venv/bin/python -m pytest .

  test-unstructured2graph:
    needs: changes
    if: ${{ needs.changes.outputs.unstructured2graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: unstructured2graph
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          # MAGE image bundles the embeddings module the e2e tests exercise.
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false
        working-directory: .

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7687) 2>/dev/null; then
              echo "Memgraph is accepting Bolt connections"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs memgraph || true
          exit 1
        working-directory: .

      - name: Install uv
        run: python -m pip install uv
        working-directory: .

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .[test]

      - name: Download NLTK data
        run: |
          # unstructured.nlp.tokenize auto-downloads these on first import
          # (AUTO_DOWNLOAD_NLTK, quiet=True by default), which failed silently
          # in CI and surfaced as 22 unrelated-looking pytest failures instead
          # of a clear error -- see #257. Downloading explicitly here, with
          # real output, makes a real failure loud instead of silent.
          .venv/bin/python -m nltk.downloader averaged_perceptron_tagger_eng punkt_tab

      - name: Run tests
        env:
          # Explicit env vars, not just memgraph-toolbox's Python-level
          # defaults: LightRAG's own storage backends (exercised by
          # test_e2e_lightrag.py) read these directly and raise if MEMGRAPH_URL
          # is unset, even when a real Memgraph is reachable by default.
          MEMGRAPH_URL: bolt://localhost:7687
          MEMGRAPH_USER: ""
          MEMGRAPH_PASSWORD: ""
          MEMGRAPH_DATABASE: memgraph
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: .venv/bin/python -m pytest .

  test-agent-context-graph:
    needs: changes
    if: ${{ needs.changes.outputs.agent-context-graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: context-graph/agent-context-graph
        run: uv run --package agent-context-graph --extra test pytest tests/ -v

  test-skills-graph:
    needs: changes
    if: ${{ needs.changes.outputs.skills-graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if echo "RETURN 1;" | docker exec -i memgraph mgconsole --host 127.0.0.1 --port 7687 >/dev/null 2>&1; then
              echo "Memgraph is ready to serve queries"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs memgraph || true
          exit 1

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: context-graph/skills-graph
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --package skills-graph --extra test --extra agent-context-graph pytest tests/ -v

  test-actions-graph:
    needs: changes
    if: ${{ needs.changes.outputs.actions-graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if echo "RETURN 1;" | docker exec -i memgraph mgconsole --host 127.0.0.1 --port 7687 >/dev/null 2>&1; then
              echo "Memgraph is ready to serve queries"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs memgraph || true
          exit 1

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: context-graph/actions-graph
        run: uv run --package actions-graph --extra test --extra agent-context-graph pytest tests/ -v

  test-sessions-graph:
    needs: changes
    if: ${{ needs.changes.outputs.sessions-graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Memgraph container
        run: |
          # MAGE image bundles the embeddings module the reconciliation e2e test exercises.
          docker run -d -p 7687:7687 --name memgraph memgraph/memgraph-mage:latest --schema-info-enabled=True --telemetry-enabled=false

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7687) 2>/dev/null; then
              echo "Memgraph is accepting Bolt connections"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs memgraph || true
          exit 1

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        working-directory: context-graph/sessions-graph
        env:
          # Explicit env vars, not just memgraph-toolbox's Python-level
          # defaults: LightRAG's own storage backends (exercised by
          # test_e2e_reconciliation.py) read these directly and raise if
          # MEMGRAPH_URL is unset, even when a real Memgraph is reachable by default.
          MEMGRAPH_URL: bolt://localhost:7687
          MEMGRAPH_USER: ""
          MEMGRAPH_PASSWORD: ""
          MEMGRAPH_DATABASE: memgraph
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --package sessions-graph --extra test --extra reconciliation --extra agent-context-graph pytest tests/ -v

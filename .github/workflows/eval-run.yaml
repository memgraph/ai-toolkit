name: Run the context-graph eval loop (manual)

# Manual-trigger only, deliberately not on push/pull_request -- the same
# reasoning as test-live-graph-model.yaml, for three separate reasons:
#
#  1. Cost. A dev workload's build is hours of GLiNER2 on a runner's CPU,
#     and every question is an answering call plus a judge call.
#  2. Non-determinism. Judged scores vary run to run; #304 addresses that with
#     repeat-and-compare calibration, not a pass/fail gate. Gating on a noisy
#     metric produces flaky CI that teaches people to ignore it.
#  3. It would contradict a decision already made. #299 chose human-gated
#     promotion: eval produces a comparison report a person reads. A CI gate on
#     the score is automatic promotion wearing a different hat.
#
# The fast, deterministic, LLM-free half of this package's tests DOES run on
# every PR -- see the test-context-graph-eval job in tests.yaml.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload to run (see `context-graph-eval workloads`)"
        type: choice
        required: false
        default: lme-s-dev
        options:
          - lme-s-dev
          - beam-100k-dev
      rubric_judge:
        description: "LongMemEval only: 'provider:model_id' for the deepeval rubrics beside the official judge (blank = none)"
        required: false
        default: ""

jobs:
  eval-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Start the dedicated eval Memgraph
        run: |
          # A dedicated instance, wiped before each batch. Per-batch *databases*
          # were the original plan (#309) but that is multi-tenancy and needs an
          # Enterprise licence; a dedicated instance gives the same
          # known-fixed-state guarantee on a community licence.
          #
          docker run -d -p 7689:7687 --name eval-memgraph memgraph/memgraph-mage:3.13.2 --telemetry-enabled=false

      - name: Wait for Memgraph to be ready
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7689) 2>/dev/null; then
              echo "Memgraph is accepting Bolt connections"
              exit 0
            fi
            echo "Waiting for Memgraph (attempt $i)..."
            sleep 2
          done
          echo "Memgraph did not become ready in time" >&2
          docker logs eval-memgraph || true
          exit 1

      - name: Install uv
        run: python -m pip install uv

      - name: Sync workspace environment
        run: uv sync --package context-graph-eval --extra pipeline

      - name: Run the workload
        env:
          # Answering and both upstream judges run on OpenAI; the optional
          # rubric judge on Anthropic, a different provider (#304).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A fresh runner has no kept graph, so this builds it first.
          uv run --package context-graph-eval context-graph-eval run "${{ inputs.workload }}" \
            --memgraph-url bolt://localhost:7689 \
            --save eval-run.json \
            ${{ inputs.rubric_judge && format('--rubric-judge {0}', inputs.rubric_judge) || '' }} \
            | tee eval-report.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.txt
            eval-run.json

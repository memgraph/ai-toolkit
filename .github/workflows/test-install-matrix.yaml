name: Test install scripts (Linux, Windows)

# Runs the checked-in context-graph/scripts/install.sh and install.ps1 the way a
# new user's one-liner does, then asserts the machine ends up with a working,
# idempotent, removable install. It runs the files in this checkout, not the
# published launchers (those are checked nightly from memgraph-platform).
# On Linux the packages and the Claude Code plugin come from this checkout too
# (install-e2e/overrides.sh, local-marketplace.sh), so a PR is tested rather
# than the last release; Windows still installs the released packages.
# Only one Linux leg calls a model, for one real Claude Code session; without
# the secret (fork PRs) that step says so and passes, and the rest still runs.
on:
  pull_request:
    paths:
      - "context-graph/scripts/install.sh"
      - "context-graph/scripts/install.ps1"
      - "context-graph/scripts/install-e2e/**"
      - "context-graph/memgraph-context-graph/src/**"
      - "context-graph/plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/test-install-matrix.yaml"
  workflow_dispatch: {}

concurrency:
  group: install-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
        uv: [absent, present]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv ahead of the script
        if: matrix.uv == 'present'
        run: python3 -m pip install --user uv

      - name: Install agent CLIs the installer should wire
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Install this checkout's packages and Claude Code plugin, not the released ones
        run: |
          echo "UV_OVERRIDE=$(./context-graph/scripts/install-e2e/overrides.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          ./context-graph/scripts/install-e2e/local-marketplace.sh "$RUNNER_TEMP"

      # No terminal on the runner, so setup takes its plain path; it starts Memgraph in Docker itself.
      # No agent named, as the one-liner runs: setup wires every agent it finds.
      - name: Run install.sh
        run: ./context-graph/scripts/install.sh --user-id ci-test-user

      # doctor's plugin:<runtime> check is what says each agent will call the hooks at all.
      - name: A fresh shell finds the tool and doctor is green for both agents
        run: |
          bash -lc 'memgraph-context-graph --version && memgraph-context-graph doctor && memgraph-context-graph doctor --runtime codex'

      # The only step that proves the hooks fire: the installed plugin, run by a real claude, writing to Memgraph.
      - name: A real Claude Code session lands in the graph
        if: matrix.os == 'ubuntu-24.04' && matrix.uv == 'absent'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          "$(uv tool dir)/memgraph-context-graph/bin/python" context-graph/scripts/install-e2e/session_lands.py --user ci-test-user

      - name: A second run changes nothing and still succeeds
        run: ./context-graph/scripts/install.sh --user-id ci-test-user

      - name: Uninstall leaves the graph and removes the wiring
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          memgraph-context-graph uninstall claude-code codex
          docker ps --format '{{.Names}}' | grep -q memgraph

      # Uninstall left nothing wired, so this is a first run again: Enter at every question must still wire
      # the agents found. Setup once started with none ticked, so Enter-through wired nothing and reported success.
      - name: An interactive first run, Enter at every question, wires the agents it finds
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          ./context-graph/scripts/install-e2e/local-marketplace.sh "$RUNNER_TEMP"
          python3 context-graph/scripts/install-e2e/enter_through_setup.py \
            --expect "Claude Code: install the Context Graph plugin (user-wide)" \
            --expect "Codex: install the Context Graph plugin (user-wide)" \
            --expect "Context Graph is set up." \
            -- bash ./context-graph/scripts/install.sh
          memgraph-context-graph doctor

      - name: Piped through bash on a pty, the interactive branch does not hang
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          # No input is given, so the TUI must exit rather than wait; 60s catches a hang.
          script -qec "timeout 60 bash ./context-graph/scripts/install.sh --plan" /dev/null < /dev/null

      # Last: the tool removes itself, so nothing after this step can run it.
      - name: Uninstall --all leaves nothing behind
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          memgraph-context-graph uninstall --all
          # set -e ignores a failing `! cmd`, so each check fails the step itself.
          left() { echo "::error::uninstall --all left $1"; exit 1; }
          # This shell ran the tool, so bash still remembers its path; forget it before looking.
          hash -r
          if command -v memgraph-context-graph; then left "the tool's executable"; fi
          if uv tool list | grep -q '^memgraph-context-graph '; then left "the tool"; fi
          if docker container inspect context-graph-memgraph >/dev/null 2>&1; then left "the container"; fi
          if docker volume inspect context-graph-memgraph-data >/dev/null 2>&1; then left "the volume"; fi
          if [ -e ~/.config/context-graph/config.toml ]; then left "the config"; fi
          if claude plugin list --json | grep -q context-graph@context-graph-plugins; then left "the plugin"; fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        uv: [absent, present]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv ahead of the script
        if: matrix.uv == 'present'
        shell: pwsh
        run: python -m pip install --user uv

      - name: Install agent CLIs the installer should wire
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      # Docker on this runner runs Windows containers, which cannot run Memgraph's Linux image, so
      # Memgraph runs in WSL2 and setup is pointed at it; Bolt is reachable on Windows' localhost.
      # WSL1 installs Memgraph but its port is not reachable from Windows (probe run on this PR).
      # WSL2 shuts its VM down shortly after the last wsl.exe session ends, which a CI step boundary
      # triggers; the next `wsl` start then wipes /tmp. This must exist before the distro first starts.
      - name: Keep the WSL2 VM from idling out
        shell: pwsh
        run: |
          Set-Content -Path "$env:USERPROFILE\.wslconfig" -Value "[wsl2]`nvmIdleTimeout=-1"

      # Installing the distro occasionally stalls on a hosted runner (the step then runs until the job
      # times out, 30 minutes), so it is capped and tried a second time.
      - name: WSL distro for Memgraph
        id: wsl
        continue-on-error: true
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          use-cache: "false"

      - name: WSL distro for Memgraph (second attempt)
        if: steps.wsl.outcome == 'failure'
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          use-cache: "false"

      # The image setup itself starts on Linux: it carries MAGE, which the embeddings check needs. Docker
      # on this runner is Windows-container only, so it runs in WSL2 and publishes Bolt to Windows.
      - name: Install Docker in WSL
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl enable --now docker

      # A wsl.exe session is kept open so the distro stays up even if the idle timeout setting is ignored.
      - name: Start Memgraph in WSL
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -- sudo docker run -d --name memgraph -p 7687:7687 --restart unless-stopped memgraph/memgraph-mage:3.13.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -FilePath wsl.exe -WindowStyle Hidden -ArgumentList @('-d', 'Ubuntu-24.04', '--', 'sleep', 'infinity')

      # A TCP check is not enough: WSL's localhost relay accepts connections on the port even when
      # nothing listens inside the distro. Ask Memgraph itself.
      - name: Memgraph answers a Bolt query on Windows' localhost
        shell: pwsh
        run: |
          python -m pip install --quiet neo4j
          $probe = @'
          from neo4j import GraphDatabase
          d = GraphDatabase.driver("bolt://127.0.0.1:7687", auth=("", ""), connection_timeout=3.0)
          print(d.session().run("SHOW VERSION").data())
          '@
          foreach ($attempt in 1..20) {
            $out = python -c $probe 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Host "memgraph answered after $attempt attempt(s): $out"; exit 0 }
            Start-Sleep -Seconds 3
          }
          Write-Host $out
          wsl -d Ubuntu-24.04 -- bash -c 'sudo docker ps -a; sudo docker logs --tail 40 memgraph'
          exit 1

      - name: Memgraph is still up 45 seconds later (steps must not end it)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 45
          $probe = 'from neo4j import GraphDatabase; print(GraphDatabase.driver("bolt://127.0.0.1:7687", auth=("", ""), connection_timeout=3.0).session().run("SHOW VERSION").data())'
          python -c $probe
          if ($LASTEXITCODE -ne 0) {
            wsl --list --verbose
            wsl -d Ubuntu-24.04 -- bash -c 'uptime; sudo docker ps -a; sudo docker logs --tail 60 memgraph'
            exit 1
          }

      # A child process of the edition under test (`shell` takes no expressions). Its PATH change
      # does not reach this step, which is the point: later steps see only what was persisted.
      - name: Run install.ps1
        shell: pwsh
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./context-graph/scripts/install.ps1 claude-code codex --user-id ci-test-user --memgraph-url bolt://127.0.0.1:7687

      - name: Why setup's Memgraph probe fails (runs only on failure)
        if: failure()
        shell: pwsh
        run: |
          $py = Join-Path (& "$env:USERPROFILE\.local\bin\uv.exe" tool dir) 'memgraph-context-graph\Scripts\python.exe'
          $diag = @'
          from memgraph_context_graph.adapters._identity import load_config
          from memgraph_context_graph.setup.memgraph import version_at
          c = load_config()
          print("user/password:", repr(c.memgraph_user), repr(c.memgraph_password))
          print("version_at:", version_at("bolt://127.0.0.1:7687", c.memgraph_user, c.memgraph_password))
          import neo4j
          print("neo4j", neo4j.__version__)
          d = neo4j.GraphDatabase.driver("bolt://127.0.0.1:7687", auth=(c.memgraph_user, c.memgraph_password), connection_timeout=3.0, max_connection_lifetime=3.0)
          try:
              print(d.session().run("SHOW VERSION").data())
          except Exception as e:
              print(type(e).__name__, e)
          '@
          & $py -c $diag

      - name: A new terminal finds the tool (persistent user PATH) and doctor is green
        shell: cmd
        run: |
          powershell -NoProfile -Command "$p=[Environment]::GetEnvironmentVariable('Path','User'); $env:Path=$p; memgraph-context-graph --version; memgraph-context-graph doctor; exit $LASTEXITCODE"

      - name: A second run changes nothing and still succeeds
        shell: pwsh
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./context-graph/scripts/install.ps1 claude-code codex --user-id ci-test-user --memgraph-url bolt://127.0.0.1:7687

      - name: Uninstall removes the wiring
        shell: cmd
        run: |
          powershell -NoProfile -Command "$env:Path=[Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path; memgraph-context-graph uninstall claude-code codex; exit $LASTEXITCODE"

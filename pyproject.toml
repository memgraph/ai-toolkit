[project]
name = "memgraph-ai"
version = "0.2.5"
description = "Memgraph AI Toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "memgraph-toolbox>=0.1.11",
    "mcp[cli]>=1.23.0",
    "neo4j>=5.28.1",
]

[tool.uv.sources]
memgraph-toolbox = { workspace = true }
lightrag-memgraph = { workspace = true }
hygm = { workspace = true }

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "authlib>=1.9.1",
    "black>=26.10.1",
    "certifi>=2026.10.18",
    "claude-agent-sdk>=0.2.121",
    "cryptography>=50.0.0",
    "dnspython>=2.9.0; python_version >= '3.11'",
    "ecdsa>=0.19.2",
    "fastmcp>=3.4.10,<4",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "fsspec>=2026.6.0",
    "idna>=3.15",
    "json-repair>=0.60.1",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langchain-classic>=1.0.7",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.4.4",
    "langsmith>=0.8.18",
    # litellm 1.103+ requires mcp 2, which the MCP integrations are not on yet.
    "litellm>=1.95.0,<1.103",
    "lxml>=6.1.0",
    "marshmallow>=3.26.2",
    "mcp>=1.30.0,<2",
    "multidict>=6.9.1,<7",
    "nltk>=3.10.4",
    "onnx>=1.22.0",
    # openai 2.45 made usage.cache_write_tokens required; openai-agents 0.14 omits it.
    "openai<2.45",
    "opentelemetry-api>=1.45.1",
    "pi-heif>=1.3.0; python_version >= '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "pyjwt>=2.15.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "sentence-transformers>=5.6.0,<6",
    "setuptools>=84.1.0",
    "soupsieve>=2.9.0,<3",
    "starlette>=1.3.1",
    "torch>=2.13.0",
    "transformers>=5.0.0rc3",
    "unstructured>=0.24.1; python_version >= '3.11'",
    "urllib3>=2.8.0",
    "vcrpy>=8.2.1",
    "wheel>=0.46.2",
]

[tool.uv.workspace]
members = [
    "memgraph-toolbox/",
    "hygm/",
    "integrations/langchain-memgraph/",
    "integrations/mcp-memgraph/",
    "integrations/lightrag-memgraph",
    "agents/sql2graph/",
    "unstructured2graph",
    "context-graph/skills-graph",
    "context-graph/actions-graph",
    "context-graph/memgraph-context-graph",
    "context-graph/sessions-graph",
    "context-graph/resources-graph",
    "context-graph/spaces",
    "context-graph/eval",
    "context-graph/viewer",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# Notebook cells reference variables from earlier cells -- same reasoning as
# the ruff F821 per-file-ignore for *.ipynb below; a static checker can't
# model notebook cell execution order.
exclude = ["**/*.ipynb"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long — handled by the formatter
    "N803",    # argument name should be lowercase — domain uses uppercase (e.g. G for graph, SQL identifiers)
    "N806",    # variable in function should be lowercase — same domain reason as N803
    "N812",    # lowercase imported as non-lowercase — allows aliasing conventions like `import x as X`
    "N815",    # mixed-case variable in class scope — graph/DB field names follow external conventions
    "RUF001",  # ambiguous unicode character in string — false positives on intentional unicode content
]

[tool.ruff.lint.isort]
known-first-party = ["hygm", "memgraph_toolbox", "mcp_memgraph", "langchain_memgraph", "lightrag_memgraph", "unstructured2graph", "skills_graph", "actions_graph", "memgraph_context_graph", "resources_graph", "context_graph_spaces", "context_graph_viewer"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells reference variables from earlier cells — not actual undefined names
"*.ipynb" = ["F821"]

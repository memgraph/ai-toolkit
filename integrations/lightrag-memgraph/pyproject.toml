[project]
name = "lightrag-memgraph"
version = "0.3.1"
description = "LightRAG integration with Memgraph"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Memgraph Tech Team", email = "tech@memgraph.com"},
]
license = { text = "MIT" }
keywords = ["memgraph", "graph", "integration", "toolkit", "lightrag"]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Pinned to exactly 1.5.4: 1.5.5 (2026-07-31) added new @abstractmethod
    # requirements to DocStatusStorage (a "memory-bounded scheduling" API --
    # get_docs_by_statuses_page/get_docs_by_ids/get_full_docs_by_ids/
    # resolve_doc_source_strict) that MemgraphDocStatusStorage doesn't
    # implement yet, so LightRAG() construction raises TypeError. See #250.
    # Also still capped below 1.6 for the separate reason registry.py's
    # compat guard documents (lightrag.kg internals this integration
    # monkey-patches). Bump only after implementing the new interface.
    "lightrag-hku==1.5.4",
    "memgraph-toolbox>=0.1.11",
    "numpy>=1.22.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "voyageai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "black>=26.3.1",
    "isort>=5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/memgraph/ai-toolkit"
"Source" = "https://github.com/memgraph/ai-toolkit/tree/main/integrations/lightrag-memgraph"
"Issues" = "https://github.com/memgraph/ai-toolkit/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling", "build", "setuptools"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightrag_memgraph"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[project]
name = "agent-context-graph"
version = "0.3.1"
description = "Connect agent SDKs to context-graph components (actions-graph, skills-graph, etc.)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox>=0.1.11",
]

[project.scripts]
agent-context-graph = "agent_context_graph.cli:main"

[project.entry-points."agent_context_graph.runtimes"]
codex = "agent_context_graph.adapters.codex:PLUGIN"
claude-code = "agent_context_graph.adapters.claude_code:PLUGIN"
copilot-cli = "agent_context_graph.adapters.copilot_cli:PLUGIN"
cursor = "agent_context_graph.adapters.cursor:PLUGIN"
opencode = "agent_context_graph.adapters.opencode:PLUGIN"
antigravity-cli = "agent_context_graph.adapters.antigravity_cli:PLUGIN"
grok = "agent_context_graph.adapters.grok:PLUGIN"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.1.0",
]
mcp = [
    "mcp>=1.23.0,<3",
]
openai = [
    "openai-agents>=0.1.0",
]
test = [
    "mcp>=1.23.0,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/agent_context_graph/adapters/_opencode_plugin.js"]

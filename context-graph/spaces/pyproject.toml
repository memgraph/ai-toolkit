[project]
name = "context-graph-spaces"
version = "0.1.0"
description = "The Enterprise edition of Context Graph: personal and shared memory spaces for many users on one Memgraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agent-context-graph>=0.4.0",
    "memgraph-toolbox",
    "neo4j>=5.0",
    # tomllib on 3.11+; tomli for 3.10, which ty checks against.
    "tomli>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "sessions-graph[agent-context-graph]>=0.6.0",
]

[project.scripts]
context-graph-spaces = "context_graph_spaces.cli:main"

[tool.uv.sources]
agent-context-graph = { workspace = true }
memgraph-toolbox = { workspace = true }
sessions-graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

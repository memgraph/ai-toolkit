[project]
name = "sessions-graph"
version = "0.12.1"
description = "Cross-session memory store for agents, backed by Memgraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox>=0.2.2",
    # The Session Node's shape and constraint (memgraph_context_graph.session).
    "memgraph-context-graph",
    "tiktoken>=0.8.0",
    "nltk>=3.9.1",
]

[project.optional-dependencies]
# Compatibility alias: exchange packing dependencies are now installed by default.
compact = []
# MemgraphMemoryTool: the memory tool for apps built on the Claude API.
anthropic = [
    "anthropic>=0.74.0",
]
memgraph-context-graph = [
    "memgraph-context-graph>=0.12.0",
]
# The SDK apps' memory (memgraph_context_graph.sdk) is tested here, against this package's graph.
sdk = [
    "memgraph-context-graph[claude,openai]",
]
reconciliation = [
    "actions-graph>=0.4.0",
    # The derivation LLM: whichever key is configured (derive_llm.py).
    "anthropic>=0.77.0",
    "hygm>=0.2.0",
    "openai>=2.0.0",
    "unstructured2graph>=0.7.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
sessions-graph = "sessions_graph.cli:main"

[project.entry-points."memgraph_context_graph.tools"]
recall = "sessions_graph.tool:RECALL"
memory = "sessions_graph.tool:MEMORY"

[project.entry-points."memgraph_context_graph.connectors"]
sessions-graph = "sessions_graph.connector:CONNECTOR"

[tool.uv.sources]
memgraph-context-graph = { workspace = true }
memgraph-toolbox = { workspace = true }
actions-graph = { workspace = true }
hygm = { workspace = true }
unstructured2graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

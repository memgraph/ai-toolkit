[project]
name = "sessions-graph"
version = "0.7.0"
description = "Cross-session memory store for agents, backed by Memgraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox",
]

[project.optional-dependencies]
agent-context-graph = [
    "agent-context-graph>=0.4.0",
]
reconciliation = [
    "actions-graph>=0.4.0",
    # The derivation LLM: whichever key is configured (derive_llm.py).
    "anthropic>=0.74.0",
    "hygm>=0.2.0",
    "openai>=2.0.0",
    "unstructured2graph>=0.7.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
sessions-graph = "sessions_graph.cli:main"

[project.entry-points."agent_context_graph.tools"]
recall = "sessions_graph.tool:RECALL"

[tool.uv.sources]
agent-context-graph = { workspace = true }
memgraph-toolbox = { workspace = true }
actions-graph = { workspace = true }
hygm = { workspace = true }
unstructured2graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

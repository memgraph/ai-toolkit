[project]
name = "memgraph-context-graph"
version = "0.12.0"
description = "Connect agent SDKs to context-graph components (actions-graph, skills-graph, etc.)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox>=0.2.2",
    # Edits ~/.codex/config.toml when switching Codex's memory, keeping the user's comments and layout.
    "tomlkit>=0.13,<1",
]

[project.scripts]
memgraph-context-graph = "memgraph_context_graph.cli:main"

[project.entry-points."memgraph_context_graph.runtimes"]
codex = "memgraph_context_graph.adapters.codex:PLUGIN"
claude-code = "memgraph_context_graph.adapters.claude_code:PLUGIN"
copilot-cli = "memgraph_context_graph.adapters.copilot_cli:PLUGIN"
cursor = "memgraph_context_graph.adapters.cursor:PLUGIN"
opencode = "memgraph_context_graph.adapters.opencode:PLUGIN"
antigravity-cli = "memgraph_context_graph.adapters.antigravity_cli:PLUGIN"
grok = "memgraph_context_graph.adapters.grok:PLUGIN"

[project.optional-dependencies]
# memgraph_context_graph.sdk.claude: PostToolUseFailure, SubagentStart and PermissionRequest callbacks.
claude = [
    "claude-agent-sdk>=0.1.30",
]
mcp = [
    "mcp>=1.23.0,<3",
]
# memgraph_context_graph.sdk.openai: the run's input on its hook context (turn_input).
openai = [
    "openai-agents>=0.8.0",
]
test = [
    "mcp>=1.23.0,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
markers = [
  "docker: starts real Memgraph containers, so it needs Docker; CI runs these in their own job",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/memgraph_context_graph/adapters/_opencode_plugin.js"]

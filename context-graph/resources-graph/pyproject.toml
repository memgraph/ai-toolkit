[project]
name = "resources-graph"
version = "0.1.0"
description = "Public GitHub resources an agent explored, remembered in Memgraph and served from memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox",
]

[project.optional-dependencies]
agent-context-graph = [
    "agent-context-graph>=0.3.0",
]
test = [
    "pytest>=9.0.3",
    # The real owner of (:User)-[:HAD_SESSION], so privacy tests don't fake it.
    "sessions-graph>=0.6.0",
]

[project.scripts]
resources-graph = "resources_graph.cli:main"

[project.entry-points."agent_context_graph.tools"]
resource = "resources_graph.tool:RESOURCE"

[tool.uv.sources]
agent-context-graph = { workspace = true }
memgraph-toolbox = { workspace = true }
sessions-graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

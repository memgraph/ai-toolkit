[project]
name = "actions-graph"
version = "0.6.0"
description = "Store and track LLM actions, tool calls, and sessions in Memgraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "memgraph-toolbox",
    # The Session Node's shape and constraint (memgraph_context_graph.session).
    "memgraph-context-graph",
]

[project.optional-dependencies]
memgraph-context-graph = [
    "memgraph-context-graph>=0.5.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[project.entry-points."memgraph_context_graph.connectors"]
actions-graph = "actions_graph.connector:CONNECTOR"

[tool.uv.sources]
memgraph-context-graph = { workspace = true }
memgraph-toolbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

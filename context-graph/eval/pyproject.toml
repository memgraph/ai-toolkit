[project]
name = "context-graph-eval"
version = "0.1.0"
description = "Evaluation loop for the Context Graph family: corpus conversion, retrieval scoring, and reporting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "deepeval>=3.5.2",
]

[project.optional-dependencies]
pipeline = [
    "sessions-graph>=0.5.0",
    "actions-graph>=0.1.1",
    "unstructured2graph>=0.6.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
sessions-graph = { workspace = true }
actions-graph = { workspace = true }
unstructured2graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

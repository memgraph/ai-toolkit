[project]
name = "hygm"
version = "0.2.0"
description = "Hypothetical Graph Model: a shared graph schema/ontology model and the strategies that produce one"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Memgraph Tech Team", email = "tech@memgraph.com"},
]
license = { text = "MIT" }
keywords = ["memgraph", "graph", "ontology", "schema"]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OwlImportStrategy only; imported lazily, so the rest of hygm never needs it.
owl = [
    "rdflib>=7.0.0",
]
test = [
    "pytest>=9.0.3",
    "rdflib>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/memgraph/ai-toolkit"
"Source" = "https://github.com/memgraph/ai-toolkit/tree/main/hygm"
"Issues" = "https://github.com/memgraph/ai-toolkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hygm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

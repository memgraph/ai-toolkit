# A relation with no backing rows: equal properties on its two endpoints.
version: 1
model: ../models/shop.model.yaml
sources:
  - {name: crm, kind: table}
nodes:
  - type: Customer
    source: crm
    table: {name: customers}
    id: [customer_id]
    properties:
      - {name: customer_id, column: customer_id}
  - type: Order
    source: crm
    table: {name: orders}
    id: [order_id]
    properties:
      - {name: order_id, column: order_id}
      - {name: customer_ref, column: customer_id}
relations:
  - type: placed
    join: {from: {type: Customer, property: customer_id}, to: {type: Order, property: customer_ref}}

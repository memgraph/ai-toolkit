version: 2
node_types:
  - label: WineRegion
    description: Where wine is made
    key: [name]
    properties: [{name: name, required: true}]
  - label: Winery
    description: Makes wine
    properties: [{name: name, required: true}, {name: founded, type: date}]
  - label: Wine
    description: A wine
    properties:
      - {name: name, required: true}
      - {name: colour, values: [red, white, rose]}
      - {name: grapes, max_count: null, values: [cabernet_sauvignon, merlot, petit_verdot]}
      - {name: alcohol, type: float, minimum: 5, maximum: 22}
      - {name: bottle_ml, type: integer, default: 750}
  - label: RedWine
    description: A red wine
    parents: [Wine]
    properties: [{name: colour, values: [red], value: red}]
relation_types:
  - {label: located_in, description: where it is, start_labels: [Winery], end_labels: [WineRegion], min_count: 1, max_count: 1}
  - {label: maker, description: who made it, start_labels: [Wine], end_labels: [Winery], min_count: 1, max_count: 1}
  - {label: produces, description: what it made, start_labels: [Winery], end_labels: [Wine], inverse_of: maker}
  - {label: pairs_with, description: goes well with, start_labels: [Wine], end_labels: [Wine], symmetric: true}
individuals:
  - id: bordeaux
    type: WineRegion
    iri: https://example.org/wine#Bordeaux
    properties: {name: Bordeaux}
  - id: chateau_margaux
    type: Winery
    properties: {name: Château Margaux, founded: "1590-01-01"}
    relations: {located_in: [bordeaux], produces: [margaux_2015]}
  - id: margaux_2015
    type: RedWine
    properties: {name: Château Margaux 2015, grapes: [cabernet_sauvignon, merlot], alcohol: 13.5}
    relations: {pairs_with: [pavillon_2015]}
  - id: pavillon_2015
    type: RedWine
    properties: {name: Pavillon Rouge 2015, grapes: [], alcohol: 13}
    relations: {maker: [chateau_margaux]}
